[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "warba-client-documentation"
version = "0.1.0"
description = "AI-Powered Client Documentation for Warba Bank Corporate Banking (Track 1)"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "anthropic>=0.40",
    "python-jose[cryptography]>=3.3",
    "bcrypt>=4.1",
    "python-multipart>=0.0.12",
    "pyyaml>=6.0",
    "python-docx>=1.1",
    "weasyprint>=63.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-PyYAML",
]

[tool.setuptools.packages.find]
include = ["app*"]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "TID"]
ignore = [
    "B008",  # FastAPI Depends() in argument defaults is the framework's idiom
    # `from sqlalchemy.dialects.postgresql import UUID as PgUUID` is deliberate:
    # the alias disambiguates the SQLAlchemy column type from `uuid.UUID`, which is
    # used in the same files for Python-side values. Renaming it to satisfy the
    # constant-casing rule would make the models harder to read, not easier.
    "N811",
]

# T005 — Provider boundary (Constitution Principle VI, NFR-SCA-04).
#
# `anthropic` may be imported from exactly one module: app/adapters/anthropic_adapter.py.
# Business logic depends on app/ports/generation_port.py, never on a vendor SDK.
# This is enforced mechanically so provider substitutability is a verified property
# rather than a matter of intent. The per-file ignore below is the single exemption.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"anthropic".msg = "Import `anthropic` only in app/adapters/anthropic_adapter.py. Business logic must depend on app.ports.generation_port.GenerationPort (Constitution VI, NFR-SCA-04)."

[tool.ruff.lint.per-file-ignores]
"app/adapters/anthropic_adapter.py" = ["TID251"]
"tests/*" = ["TID251"]

# ---------------------------------------------------------------------------
# Mypy — strict on the modules carrying constitutional guarantees
# ---------------------------------------------------------------------------

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "app.documents.validators",
    "app.screening.*",
    "app.audit.*",
]
strict = true
disallow_untyped_defs = true
warn_return_any = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "model: test makes real model calls; requires --run-model",
]
addopts = "--strict-markers"
