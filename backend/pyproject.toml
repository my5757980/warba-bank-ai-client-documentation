[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "warba-client-documentation"
version = "0.1.0"
description = "AI-Powered Client Documentation for Warba Bank Corporate Banking (Track 1)"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    # [email] because auth.py uses EmailStr, which needs email-validator at import
    # time. It was reaching the dev environment transitively; a clean install crashes
    # on startup without it.
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "anthropic>=1.0",
    "google-genai>=1.0",
    "python-jose[cryptography]>=3.3",
    "bcrypt>=4.1",
    "python-multipart>=0.0.12",
    "pyyaml>=6.0",
    "python-docx>=1.1",
    # NOTE: no weasyprint. PDF export is not implemented yet (export.py returns 501),
    # and weasyprint pulls GTK/Cairo/Pango system libraries that roughly double the
    # container image and are a common source of Linux build failures. Add it back in
    # the same commit that actually implements PDF rendering.
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-PyYAML",
]

[tool.setuptools.packages.find]
include = ["app*"]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "TID"]
ignore = [
    "B008",  # FastAPI Depends() in argument defaults is the framework's idiom
    # `from sqlalchemy.dialects.postgresql import UUID as PgUUID` is deliberate:
    # the alias disambiguates the SQLAlchemy column type from `uuid.UUID`, which is
    # used in the same files for Python-side values. Renaming it to satisfy the
    # constant-casing rule would make the models harder to read, not easier.
    "N811",
]

# T005 — Provider boundary (Constitution Principle VI, NFR-SCA-04).
#
# Each vendor SDK may be imported from exactly one adapter module. Business logic
# depends on app/ports/generation_port.py, never on a vendor SDK. This is enforced
# mechanically so provider substitutability is a verified property rather than a
# matter of intent — the per-file ignores below are the only exemptions.
#
# The rule earns its keep: the Gemini adapter was added without a single change to
# the services, validators, screening, or audit layers, and this rule is what proves
# that rather than merely asserting it.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"anthropic".msg = "Import `anthropic` only in app/adapters/anthropic_adapter.py. Business logic must depend on app.ports.generation_port.GenerationPort (Constitution VI, NFR-SCA-04)."
"google.genai".msg = "Import `google.genai` only in app/adapters/gemini_adapter.py. Business logic must depend on app.ports.generation_port.GenerationPort (Constitution VI, NFR-SCA-04)."

[tool.ruff.lint.per-file-ignores]
"app/adapters/anthropic_adapter.py" = ["TID251"]
"app/adapters/gemini_adapter.py" = ["TID251"]
"tests/*" = ["TID251"]

# ---------------------------------------------------------------------------
# Mypy — strict on the modules carrying constitutional guarantees
# ---------------------------------------------------------------------------

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "app.documents.validators",
    "app.screening.*",
    "app.audit.*",
]
strict = true
disallow_untyped_defs = true
warn_return_any = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "model: test makes real model calls; requires --run-model",
]
addopts = "--strict-markers"
